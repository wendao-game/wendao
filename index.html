<!doctype html><html><head><title>问道长生</title><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* Layout: 夜坐观星 — 道籍 on the left, a turning 阵盘 at the centre, 历练/宗门/道侣/洞府/丹房 on the right; stacks to one column on phones */
:root{
  --ink:#0e1320; --panel:#151c2b; --panel-2:#1c2538; --line:#2a3550;
  --fg:#e8e2d0; --muted:#8e97ac; --jade:#78d0b4; --gold:#dcb466; --cinnabar:#d9573f;
  --rose:#e39bb0; --seal-fg:#f7efdd; --bolt:#d8e7ff; --shade:rgba(6,9,16,.8);
  --f-display:"Ma Shan Zheng","STXingkai","KaiTi","STKaiti",serif;
  --f-body:"Noto Serif SC","Songti SC","SimSun","Source Han Serif SC",serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--ink);
  background-image:radial-gradient(1200px 520px at 50% -10%, var(--panel-2), transparent 70%);
  color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.6;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{
  display:grid; gap:16px; max-width:1280px; margin:0 auto;
  padding-inline:16px; padding-block:18px 40px;
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"head" "stat" "core" "side" "log";
}
@media (min-width:760px){
  .app{grid-template-columns:minmax(0,300px) minmax(0,1fr);grid-template-areas:"head head" "stat core" "side log"}
}
@media (min-width:1140px){
  .app{grid-template-columns:290px minmax(0,1fr) 380px;grid-template-rows:auto auto 1fr;
       grid-template-areas:"head head head" "stat core side" "stat log side"}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}

header{grid-area:head;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1;margin:0;color:var(--gold);letter-spacing:.06em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.head-r{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}

.stat{grid-area:stat;display:flex;flex-direction:column;gap:16px}
.idrow{display:flex;gap:14px;align-items:center}
.seal{flex:none;width:62px;height:62px;border-radius:6px;background:var(--cinnabar);color:var(--seal-fg);
  display:grid;place-items:center;font-family:var(--f-display);font-size:25px;line-height:1;
  text-align:center;line-height:1.08;box-shadow:inset 0 0 0 3px var(--cinnabar),inset 0 0 0 4px var(--seal-fg)}
.who{min-width:0}
.who .name{font-size:20px;font-weight:700;letter-spacing:.04em}
.who .sub{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.jade{color:var(--jade);border-color:var(--jade)}
.chip.gold{color:var(--gold);border-color:var(--gold)}
.chip.red{color:var(--cinnabar);border-color:var(--cinnabar)}
.chip.rose{color:var(--rose);border-color:var(--rose)}
.meter .lab{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:5px}
.meter .lab b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--jade);transition:width .15s linear}
.bar.life i{background:var(--gold)}
.bar.life.low i,.bar.mo i{background:var(--cinnabar)}
.bar.fav i{background:var(--rose)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res div{background:var(--panel-2);border-radius:8px;padding:8px 10px}
.res span{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em}
.res b{font-size:17px;font-variant-numeric:tabular-nums}
.res .pw{grid-column:1/-1;display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.res .pw span{display:inline}
.res .pw b{font-size:22px;color:var(--gold);font-family:var(--f-display);font-weight:400;letter-spacing:.04em;line-height:1.1}
.res .pw em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-basis:100%}
.res .pw b.bump{animation:bump .6s ease-out}
@keyframes bump{0%{transform:scale(1.25);color:var(--fg)}100%{transform:none}}

/* 即时反馈：贴在刚点过的条目下方 */
.fb{grid-column:1/-1;margin-top:6px;padding:7px 10px;border-left:2px solid var(--jade);background:rgba(120,208,180,.06);
  border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:5px;font-size:12px;line-height:1.5}
.fb.bad{border-color:var(--cinnabar);background:rgba(217,87,63,.07)}
.fb.gold{border-color:var(--gold);background:rgba(220,180,102,.07)}
.fb.rose{border-color:var(--rose);background:rgba(227,155,176,.07)}
.fb.new{animation:fbin .45s ease-out}
@keyframes fbin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fb .ln{color:var(--muted)}
.deltas{display:flex;flex-wrap:wrap;gap:4px}
.d{font-size:12px;line-height:1.5;padding:0 6px;border-radius:4px;background:var(--panel);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--fg)}
.d.up{color:var(--jade)}
.d.down{color:var(--cinnabar)}
.d.gold{color:var(--gold)}
.d.t{color:var(--muted)}
.fb-solo{margin-top:10px}

.toasts{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:25;
  width:min(420px,calc(100% - 32px));display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none}
.toast{pointer-events:auto;cursor:pointer;border:1px solid var(--line);border-left:3px solid var(--jade);background:var(--panel-2);
  box-shadow:0 10px 28px rgba(0,0,0,.45);border-radius:8px;padding:9px 12px;animation:toastin .3s ease-out;
  display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.5}
.toast.bad{border-left-color:var(--cinnabar)}
.toast.gold{border-left-color:var(--gold)}
.toast.rose{border-left-color:var(--rose)}
.toast.out{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 立绘 */
.fig{position:absolute;inset:0;pointer-events:none}
.fig svg{display:block;width:100%;height:100%;overflow:visible}
.fig .me{position:absolute;left:25%;top:16%;width:50%;aspect-ratio:200/220;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45));animation:breathe 4.5s ease-in-out infinite}
.fig .mate{position:absolute;width:27%;aspect-ratio:200/220;top:56%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));animation:breathe 5.2s ease-in-out infinite}
.fig .m0{left:1%}
.fig .m1{right:1%;animation-delay:-1.7s}
.fig .m2{left:1%;top:20%;width:23%;animation-delay:-3s}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pt{flex:none;width:76px;height:80px;border-radius:8px;background:radial-gradient(circle at 50% 40%,var(--line),var(--panel) 75%);border:1px solid var(--line);overflow:hidden}
.pt svg{display:block;width:100%;height:100%}
.mc{background:var(--panel-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mc-top{display:flex;gap:12px;align-items:center}
.mc-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.mc-info .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mc-name{font-family:var(--f-display);font-size:24px;line-height:1.1;color:var(--rose)}
.mc-acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mc-acts .btn.sm{flex-direction:column;gap:0;padding:6px 4px;font-size:13px;white-space:nowrap}
.mc-acts .btn small{font-size:10.5px}
.mc-acts small.no{color:var(--cinnabar)}
.mc-hint{font-size:11.5px}
.mc .fb{margin-top:0}
.mc.dead .pt{filter:grayscale(1);opacity:.55}
.mc.dead .mc-name{color:var(--muted)}
.meet-pt{align-self:center;width:128px;height:136px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,var(--panel-2),var(--ink) 80%)}
.meet-pt svg{display:block;width:100%;height:100%}
.sexrow{display:flex;gap:12px;align-items:center}
.sexrow .meet-pt{width:84px;height:90px;align-self:auto}
.sexrow .row{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:22px}
.small{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

.core{grid-area:core;display:flex;flex-direction:column;align-items:center;gap:14px}
.realm-line{display:flex;flex-direction:column;align-items:center;gap:2px}
.realm-line .big{font-family:var(--f-display);font-size:34px;line-height:1.1;letter-spacing:.08em}
.realm-line .rate{color:var(--jade);font-size:13px;font-variant-numeric:tabular-nums;text-align:center}
.disc{position:relative;width:min(100%,400px);aspect-ratio:1;max-width:100%;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.disc canvas{width:100%;height:100%;display:block}
.float{position:absolute;pointer-events:none;color:var(--jade);font-size:14px;font-weight:600;
  animation:rise .9s ease-out forwards;font-variant-numeric:tabular-nums;white-space:nowrap}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-46px);opacity:0}}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:10px 18px;cursor:pointer;
  display:inline-flex;flex-direction:column;align-items:center;line-height:1.3;transition:border-color .15s,background .15s,transform .05s}
.btn small{font-size:11px;color:var(--muted)}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.big{min-width:140px;font-size:17px;letter-spacing:.2em}
.btn.jade{border-color:var(--jade);color:var(--jade)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.gold.ready{background:var(--gold);color:var(--ink)}
.btn.gold.ready small{color:var(--ink)}
.btn.red{border-color:var(--cinnabar);color:var(--cinnabar)}
.btn.rose{border-color:var(--rose);color:var(--rose)}
.btn.sm{padding:6px 12px;font-size:13px;flex-direction:row;gap:6px}
.hint{margin:0;color:var(--muted);font-size:13px;text-align:center;max-width:44ch;text-wrap:balance}

.side{grid-area:side;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:2px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 8px 8px;cursor:pointer;color:var(--muted);font-size:15px;letter-spacing:.04em;margin-bottom:-1px;white-space:nowrap;flex:none}
.tabs button[aria-selected="true"]{color:var(--gold);border-color:var(--gold)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--panel-2);border-radius:8px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.item h3{margin:0;font-size:16px;font-weight:700;letter-spacing:.04em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item p{margin:0;font-size:13px;color:var(--muted);grid-column:1/-1}
.item .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .act{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item.locked{opacity:.5}
.cost{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cost.no{color:var(--cinnabar)}
.sec-h{font-size:12px;letter-spacing:.2em;color:var(--muted);margin:6px 0 0;font-weight:600}
.note{margin:0;font-size:13px;color:var(--muted)}
.sum{background:var(--panel-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sum .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sum .rank{font-family:var(--f-display);font-size:26px;line-height:1.1;color:var(--gold)}
.comp-name{font-family:var(--f-display);font-size:30px;line-height:1.1;color:var(--rose)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

.log{grid-area:log;display:flex;flex-direction:column;gap:8px;min-height:180px}
.log h2{margin:0;font-size:13px;letter-spacing:.2em;color:var(--muted);font-weight:600}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;font-size:14px}
.log li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.log li time{color:var(--muted);font-size:12px;padding-top:2px;font-variant-numeric:tabular-nums}
.log li.good span{color:var(--jade)}
.log li.gold span{color:var(--gold)}
.log li.bad span{color:var(--cinnabar)}
.log li.rose span{color:var(--rose)}

.modal{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;z-index:20;padding:16px;overflow-y:auto}
.card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--f-display);font-weight:400;font-size:40px;margin:0;color:var(--gold);line-height:1.1}
.card h2.red{color:var(--cinnabar)}
.card h2.rose{color:var(--rose)}
.card p{margin:0}
.card p.m{color:var(--muted);font-size:13px}
.card label{font-size:12px;letter-spacing:.2em;color:var(--muted)}
.card input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);font:inherit;font-size:18px}
.rootbox{background:var(--panel-2);border-radius:10px;padding:16px;text-align:center;min-height:104px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.rootbox .rn{font-family:var(--f-display);font-size:34px;line-height:1.1}
.rootbox .rd{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.opts{display:flex;flex-direction:column;gap:8px}
.opts .btn{align-items:flex-start;text-align:left;padding:12px 14px}
.elist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.end{background:var(--panel-2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px}
.end b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--gold);line-height:1.2}
.end span{font-size:12px;color:var(--muted)}
.end.locked b{color:var(--muted)}
.seal-end{align-self:flex-start;font-family:var(--f-display);color:var(--seal-fg);background:var(--cinnabar);padding:2px 10px;border-radius:4px;font-size:15px;letter-spacing:.1em}

.trib{position:fixed;inset:0;z-index:30;background:var(--ink);display:grid;place-items:center;overflow:hidden}
.trib canvas{position:absolute;inset:0;width:100%;height:100%}
.trib-ui{position:relative;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;width:min(380px,100% - 32px)}
.trib-ui .t{font-family:var(--f-display);font-size:48px;color:var(--bolt);line-height:1}
.trib-ui .n{font-size:18px;letter-spacing:.06em;text-wrap:balance}
.trib-ui .bar{width:100%;height:10px}
.trib-ui .bar i{background:var(--cinnabar)}
.flash{animation:flash .5s ease-out}
@keyframes flash{0%{background:var(--bolt)}100%{background:var(--ink)}}

@media (max-width:420px){.elist{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  .float{animation-duration:.01s}
  .fb.new,.toast,.res .pw b.bump,.fig .me,.fig .mate{animation:none}
  .flash{animation:none}
  .bar i{transition:none}
}
</style>

<div class="app">
  <header>
    <div class="brand">
      <h1>问道长生</h1>
      <p>凡人寿不过百载，唯修行可逆天改命。</p>
    </div>
    <div class="head-r">
      <span id="h-reinc">第一世</span>
      <button class="btn sm" id="b-sex" type="button" title="切换人物形象">形象 · 男修</button>
      <button class="btn sm gold" data-act="gallery" id="b-gallery" type="button">结局 0/10</button>
      <button class="btn sm red" id="b-reset" type="button">散功重修</button>
    </div>
  </header>

  <aside class="panel stat" aria-label="道籍">
    <div class="idrow">
      <div class="seal" id="s-seal">炼气</div>
      <div class="who">
        <div class="name" id="s-name">无名</div>
        <div class="sub" id="s-root">未测灵根</div>
      </div>
    </div>
    <div class="meter">
      <div class="lab"><span>修为</span><b id="s-xp">0 / 0</b></div>
      <div class="bar"><i id="s-xpbar"></i></div>
    </div>
    <div class="meter">
      <div class="lab"><span>寿元</span><b id="s-age">16 / 80 岁</b></div>
      <div class="bar life" id="s-lifebar-w"><i id="s-lifebar"></i></div>
    </div>
    <div class="meter" id="s-mo-w" hidden>
      <div class="lab"><span>心魔</span><b id="s-mo">0 / 100</b></div>
      <div class="bar mo"><i id="s-mobar"></i></div>
    </div>
    <div class="res">
      <div><span>灵石</span><b id="s-stones">0</b></div>
      <div><span>灵草</span><b id="s-herbs">0</b></div>
      <div class="pw"><span class="small">战力</span><b id="s-pow">100</b><em id="s-powd"></em></div>
    </div>
    <div class="chips" id="s-chips"></div>
    <dl class="kv" id="s-kv"></dl>
  </aside>

  <section class="panel core" aria-label="打坐">
    <div class="realm-line">
      <div class="big" id="c-realm">炼气一层</div>
      <div class="rate" id="c-rate">每月 +1 修为</div>
    </div>
    <div class="disc" id="disc" role="button" tabindex="0" aria-label="运功一次">
      <canvas id="cv"></canvas>
      <div class="fig" id="fig"></div>
    </div>
    <div class="actions">
      <button class="btn big jade" id="b-med" type="button">运功<small>点阵盘亦可</small></button>
      <button class="btn big gold" id="b-break" type="button" disabled>突破<small id="b-chance">修为未满</small></button>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="panel side" aria-label="行事">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="trip" type="button">历练</button>
      <button role="tab" data-tab="tower" type="button">镇妖塔</button>
      <button role="tab" data-tab="sect" type="button" id="tab-sect">宗门</button>
      <button role="tab" data-tab="comp" type="button">道侣</button>
      <button role="tab" data-tab="home" type="button">洞府</button>
      <button role="tab" data-tab="pill" type="button">丹房</button>
    </div>
    <div id="side-body"></div>
  </section>

  <section class="panel log" aria-label="修行札记">
    <h2>修行札记</h2>
    <ol id="log"></ol>
  </section>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>

<div class="trib" id="trib" hidden>
  <canvas id="tcv"></canvas>
  <div class="trib-ui">
    <div class="t" id="trib-t">九九天劫</div>
    <div class="n" id="trib-n">劫云汇聚……</div>
    <div class="bar"><i id="trib-hp"></i></div>
    <div class="small" id="trib-hpt"></div>
  </div>
</div>

<script>
(() => {

function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 10 && n % 1) return n.toFixed(1);
  n = Math.floor(n);
  if (n < 1e4) return String(n);
  if (n < 1e8) return (n / 1e4).toFixed(n < 1e5 ? 2 : 1) + '万';
  if (n < 1e12) return (n / 1e8).toFixed(2) + '亿';
  return (n / 1e12).toFixed(2) + '兆';
}

const MPS = .3;
function tick(sec) {
  if (busy()) return;
  const dt = sec * MPS;
  S.ageM += dt;
  gainXp(rate() * dt);
  S.stones += stipend() * dt;
  if (S.injT > 0 && (S.injT -= dt) <= 0) { S.injT = 0; log('伤势痊愈，经脉通畅。', 'good'); }
  if (S.tideT > 0 && (S.tideT -= dt) <= 0) { S.tideT = 0; log('灵气潮汐退去。'); }
  monthly(dt);
  if ((S.evCD -= dt) <= 0) { act('', worldEvent); S.evCD = rnd(45, 95); }
  if (S.mo >= 100 && !S.pending) S.pending = { id: 'xinmo' };
  checkLife();
  if (S.pending) showModal();
}

/* 随岁月流逝的事：宗门任务刷新、道侣情谊 */
function monthly(m) {
  const sc = S.sect;
  if (!sc.left) {
    if ((sc.refM -= m) <= 0) { genBoard(); sc.refM = 36; }
    sc.tourneyM -= m;
  }
  alive().forEach(c => {
    c.decayM += m;
    if (c.partner) c.sinceM += m;
    const per = c.partner ? 24 : 12, floor = c.partner ? 60 : 0;
    while (c.decayM >= per) { c.decayM -= per; if (c.fav > floor) c.fav--; if (c.partner) addMo(-1); }
  });
}

function checkLife() {
  if (S.over) return;
  const left = maxLifeY() - S.ageM / 12;
  if (left <= 0) {
    log(`寿元耗尽，${S.name}于洞府中坐化，享年 ${ageY()} 岁。`, 'bad');
    return endGame('age');
  }
  if (left < 10 && S.warned !== realm()) {
    S.warned = realm();
    log('寿元将尽，所余不足十年。当速求突破，或炼延寿丹续命。', 'bad');
  }
}

function worldEvent() {
  const ps = partners(), p = ps.length ? pick(ps) : null, sc = S.sect;
  const spy = ps.find(c => c.secret && !c.revealed && c.sinceM > 48);
  if (spy && !sc.left && !sc.f && Math.random() < .5) {
    spy.revealed = true; S.pending = { id: 'reveal', ci: S.comps.indexOf(spy) }; return;
  }
  if (!sc.left && S.lv >= 2 && sc.tourneyM <= 0 && Math.random() < .6) {
    sc.tourneyM = 120; S.pending = { id: 'tourney' }; return;
  }
  const roll = Math.random();
  if (roll < .22) { S.tideT = 20; log('天地灵气潮汐涌动，二十个月内修炼速度翻倍。', 'good'); }
  else if (roll < .4) { const x = rate(true) * 15; gainXp(x); log(`静坐中偶有顿悟，修为精进 ${fmt(x)}。`, 'good'); }
  else if (roll < .64) {
    const resist = clamp(.45 + .1 * S.reinc + (p ? .15 : 0) - S.mo / 250, .1, .95);
    if (Math.random() < resist) { addMo(-5); log('心魔来袭，幻象丛生。你道心坚定，将其一剑斩灭。', 'good'); }
    else { S.xp *= .9; addMo(15); log('心魔侵扰，气血翻涌，修为折损一成，心魔又深了几分。', 'bad'); }
  }
  else if (roll < .8) { const s = Math.round(stipend() * 30 + 5); S.stones += s; log(`${sc.left ? (sc.f ? '仙界道友' : '旧日故交') : F().elder}送来灵石 ${fmt(s)}。`, 'good'); }
  else if (roll < .9 && p) { const x = rate(true) * 20; gainXp(x); addMo(-6); log(`与${p.name}月下双修，心神安宁，修为精进 ${fmt(x)}。`, 'rose'); }
  else { const h = 1 + realm(); S.herbs += h; log(`洞府外灵田成熟，收得灵草 ${h} 株。`, 'good'); }
}

function meditate() {
  if (busy()) return;
  const x = rate() * .5 + 1;
  gainXp(x); S.clicks++;
  ripple(.9);
  floatText('+' + fmt(x));
}

function breakthrough() {
  if (busy() || S.xp < req(S.lv)) return;
  if (LEVELS[S.lv].trib) return startTrib(S.lv === TOP);
  const major = nextMajor(), p = chance(), from = LEVELS[S.lv].name;
  const usedPill = major && S.bpill > 0;
  if (usedPill) S.bpill = 0;
  if (Math.random() < p) {
    const cap0 = compCap();
    S.lv++; S.xp = 0;
    const pa = partner();
    partners().forEach(c => { c.lv = Math.max(c.lv, S.lv - 1); });
    if (major) {
      S.yanshou = 0; addMo(8);
      log(`${usedPill ? '服下' + REALMS[realm()].pill + '，' : ''}${pa ? pNames() + '在旁护法，' : ''}天地灵气倒灌，成功踏入${LEVELS[S.lv].name}！寿元增至 ${maxLifeY()} 年。境界愈高，心魔愈重。`, 'gold');
      if (compCap() > cap0) log(`道心愈阔，此后可与 ${compCap()} 位知己道侣同行。`, 'rose');
      ripple(3, 'gold');
    } else {
      log(`突破至${LEVELS[S.lv].name}。`, 'good');
      ripple(1.8, 'gold');
    }
    promote();
  } else if (major) {
    S.xp *= .5; S.injT = Math.max(S.injT, 45); addMo(10);
    log(`冲击${REALMS[realm() + 1].n}失败，经脉受创，修为跌落一半。`, 'bad');
    ripple(1.4, 'red');
  } else {
    S.xp *= .8;
    log(`${from}瓶颈未破，修为折损两成。`, 'bad');
    ripple(1, 'red');
  }
  save();
}

/* 斗法失利：若旧伤未愈，有陨落之危 */
function defeat(place, mon, head) {
  if (S.injT > 0 && Math.random() < .2) {
    log(head + `旧伤未愈，又遭${mon}重创……`, 'bad');
    endGame('fall', { place, mon });
    return true;
  }
  S.injT = Math.max(S.injT, 60);
  return false;
}

/* ---------- 历练 ---------- */
const locFoe = L => (L.rec + 1) * (L.k || .6 + .45 * L.t);
const winChance = L => odds(power(), locFoe(L));

function trip(i) {
  const L = LOCS[i];
  if (busy() || S.lv < L.rec) return;
  const m = ri(2, 4) + L.t;
  S.ageM += m; S.trips++;
  const base = (L.b || 10 * Math.pow(3, L.t)) * (1 + .08 * Math.max(0, S.lv - L.rec));
  const head = `【${L.n}】历练${cn(m)}月，`;
  const r = Math.random() * 100;
  if (r < 2) {
    S.gongfa++;
    log(head + `于一块残碑上参悟古法，功法精进至《${gongfaName(S.gongfa)}》！`, 'gold');
  } else if (r < 30) {
    const h = ri(1, 3) * (L.t + 1);
    S.herbs += h;
    log(head + pick(['于崖壁间', '在溪涧旁', '在一处妖兽巢穴外', '于古树根下']) + `采得灵草 ${h} 株。`, 'good');
  } else if (r < 48) {
    const s = Math.round(base * rnd(.6, 1.3));
    S.stones += s;
    log(head + pick(['拾得一具散修遗骸的储物袋', '寻到一条细小灵石矿脉', '替凡人村落驱邪得了谢礼']) + `，获灵石 ${fmt(s)}。`, 'good');
  } else if (r < 76) {
    const mon = pick(L.mons);
    if (Math.random() < winChance(L)) {
      const s = Math.round(base * rnd(1.2, 2)), h = ri(0, 2) * (L.t + 1);
      S.stones += s; S.herbs += h; gainXp(req(S.lv) * .05);
      log(head + `遭遇${mon}，激战一场将其斩杀，得灵石 ${fmt(s)}${h ? '、灵草 ' + h + ' 株' : ''}。`, 'good');
    } else {
      if (defeat(L.n, mon, head)) return;
      const lost = Math.round(S.stones * .2);
      S.stones -= lost;
      log(head + `遭遇${mon}，不敌负伤遁走，遗失灵石 ${fmt(lost)}。`, 'bad');
    }
  } else if (r < 86) {
    gainXp(req(S.lv) * .3);
    log(head + pick(['误入一处上古修士洞府，得其遗留感悟', '观山间瀑布三日，忽有所悟', '救下一只受伤灵鹤，灵鹤引你至灵泉沐浴']) + `，修为大进。`, 'gold');
  } else if (r < 93) {
    const x = rate(true) * 25;
    gainXp(x);
    log(head + `偶遇散修坊市，以物易物换得聚气丹一枚，服下得修为 ${fmt(x)}。`, 'good');
  } else {
    log(head + '一路平静，无所斩获，权当散心。');
  }
  maybeMeet(L.n, .12);
  checkLife();
  save();
}

/* ---------- 宗门 ---------- */
const sectMon = () => pick(LOCS.filter(L => L.rec <= S.lv).pop().mons);
function genTask() {
  const TS = F().tasks, i = Math.floor(Math.random() * TS.length), T = TS[i], r = realm(), k = rnd(.85, 1.2);
  return { i, c: Math.round(10 * Math.pow(1.8, r) * T.c * k), s: Math.round(12 * Math.pow(2.4, r) * T.s * k), h: T.h * (1 + r), mon: sectMon() };
}
function genBoard() { S.sect.tasks = [genTask(), genTask(), genTask()]; }
const taskFoe = d => (S.lv + 1) * d * (1 + .18 * Math.min(realm(), 8));
const taskWin = d => odds(power(), taskFoe(d));

function doTask(j) {
  const sc = S.sect, t = sc.tasks[j];
  if (busy() || sc.left || !t) return;
  const T = F().tasks[t.i];
  S.ageM += T.m;
  const head = `【${sc.f ? '天庭差事' : '宗门任务'}·${T.n}】历时${cn(T.m)}月，`;
  sc.tasks[j] = genTask();
  if (T.fight && Math.random() >= taskWin(T.fight)) {
    if (defeat(F().near, t.mon, head)) return;
    log(head + `与${t.mon}交手落败，负伤而归，任务未成。`, 'bad');
  } else {
    sc.contrib += t.c; sc.total += t.c; S.stones += t.s; S.herbs += t.h;
    if (T.x) gainXp(req(S.lv) * T.x);
    if (T.mo) addMo(T.mo);
    log(head + (T.fight ? `斩除${t.mon}，` : '') + `得贡献 ${fmt(t.c)}、灵石 ${fmt(t.s)}${t.h ? '、灵草 ' + t.h + ' 株' : ''}。`, 'good');
    promote();
  }
  maybeMeet(F().place, .06);
  checkLife();
  save();
}

function promote() {
  const sc = S.sect;
  if (sc.left) return;
  const A = F();
  while (sc.rank < 4 && sc.total >= A.total[sc.rank + 1] && S.lv >= A.lv[sc.rank + 1]) {
    sc.rank++;
    if (!sc.f && sc.rank >= 4) sc.elder = true;
    log(`${A.promo}${A.ranks[sc.rank]}，月俸随之提升。`, 'gold');
  }
}

function treasury() {
  const r = realm(), A = F(), out = [];
  out.push({ id: 'st', n: A.st, d: `领取灵石 ${fmt(15 * Math.pow(2.4, r))}。`, rk: 0, c: Math.round(10 * Math.pow(1.8, r)), ok: true });
  out.push({ id: 'hb', n: A.hb[0], d: A.hb[1], rk: 0, c: Math.round(12 * Math.pow(1.8, r)), ok: true });
  out.push({ id: 'gf', n: A.gf[0], d: `${A.gf[1]}，功法精进一重。`, rk: 1, c: Math.round(50 * Math.pow(1.75, S.gongfa)), ok: true });
  if (nextMajor() && !LEVELS[S.lv].trib) {
    const R = r + 1;
    out.push({ id: 'po', n: REALMS[R].pill, d: `${A.po}，冲击${REALMS[R].n}成功率 +35%。`, rk: 2, c: Math.round(60 * Math.pow(2.2, R)), ok: !S.bpill, why: '已备好' });
  }
  const idx = ROOTS.findIndex(x => x.id === S.root);
  out.push({ id: 'xs', n: A.xs[0], d: `以${A.xs[1]}洗练经脉，灵根提升一等（至多双灵根），每世一次。`, rk: 3,
    c: Math.round(400 * Math.pow(1.8, r)), ok: !S.xisui && idx >= 3, why: S.xisui ? '此世已用' : '灵根已臻上品' });
  return out;
}

function exchange(id) {
  const sc = S.sect;
  if (busy() || sc.left) return;
  const it = treasury().find(x => x.id === id);
  if (!it || !it.ok || sc.rank < it.rk || sc.contrib < it.c) return;
  sc.contrib -= it.c;
  const r = realm();
  if (id === 'st') { const s = Math.round(15 * Math.pow(2.4, r)); S.stones += s; log(`以贡献兑得灵石 ${fmt(s)}。`); }
  if (id === 'hb') { S.herbs += 5; log('以贡献兑得灵草五株。'); }
  if (id === 'gf') { S.gongfa++; log(`${F().gf[1]}，功法精进至《${gongfaName(S.gongfa)}》。`, 'good'); }
  if (id === 'po') { S.bpill = 1; log(`自${sc.f ? '天库' : '宗门宝库'}领得${it.n}一枚。`, 'gold'); }
  if (id === 'xs') {
    const idx = ROOTS.findIndex(x => x.id === S.root), R = ROOTS[idx - 1];
    S.root = R.id; S.xisui = true;
    S.els = S.els.slice(0, R.els) || S.els;
    log(`于${F().xs[1]}中洗髓伐脉七七四十九日，灵根蜕变为${R.n}（${S.els}）！`, 'gold');
  }
  save();
}

/* ---------- 道侣 ---------- */
function maybeMeet(place, p) {
  if (S.over || alive().length >= compCap() || S.lv < 2 || S.pending || Math.random() > p) return;
  const taken = S.comps.map(c => c.name);
  let name;
  do { name = pick(SURN) + pick(C_GIVEN); } while (taken.includes(name) || name === S.name);
  const c = {
    name, orig: pick(C_ORIG), trait: pick(C_TRAIT),
    sex: Math.random() < .8 ? (S.sex === 'f' ? 'm' : 'f') : S.sex,
    lv: clamp(S.lv + ri(-2, 3), 0, TOP - 1), fav: 10, partner: false,
    secret: Math.random() < .3, revealed: false, alive: true, sinceM: 0, decayM: 0,
  };
  c.look = genLook(c);
  S.pending = { id: 'meet', c, place, s: ri(0, MEETS.length - 1) };
}
const giftCost = () => Math.round(20 * Math.pow(2.2, realm()));
function compAct(a, ci) {
  const c = S.comps[ci];
  if (busy() || !c || !c.alive) return;
  if (a === 'gift') {
    const cost = giftCost();
    if (S.stones < cost) return;
    S.stones -= cost;
    const f = ri(6, 12); c.fav = Math.min(100, c.fav + f);
    log(`赠${c.name}${pick(['一支灵玉簪', '一枚护心镜', '一壶百年灵酒', '一卷孤本剑谱', '一盆月下昙'])}，情谊 +${f}。`, 'rose');
  } else if (a === 'talk') {
    S.ageM += 3;
    const f = ri(3, 6); c.fav = Math.min(100, c.fav + f); gainXp(req(S.lv) * .08); addMo(-10);
    log(`与${c.name}论道三月，${pick(['各有所得', '辩到天明，相视一笑', '对方一语点破你多年的困惑'])}。情谊 +${f}，心魔稍退。`, 'rose');
  } else if (a === 'travel') {
    S.ageM += 6;
    const f = ri(8, 14), h = ri(1, 3) * (1 + realm()); c.fav = Math.min(100, c.fav + f); S.herbs += h;
    log(`与${c.name}结伴同游${pick(['东海', '云梦泽', '凡间古都', '雪山之巅'])}半载，沿途采得灵草 ${h} 株。情谊 +${f}。`, 'rose');
  } else if (a === 'wed') {
    if (c.partner || c.fav < 100 || S.lv < 9) return;
    c.partner = true; c.sinceM = 0; c.lv = Math.max(c.lv, S.lv - 1);
    log(`你与${c.name}于${S.sect.left ? (S.sect.f ? '云海之上' : '荒山') : F().wed}焚香立誓，结为道侣。自此同修共进，生死相随。`, 'gold');
  } else if (a === 'hermit') {
    if (!c.partner || c.fav < 100 || realm() < 2) return;
    if (Date.now() - hermitArm > 3000 || hermitCi !== ci) { hermitArm = Date.now(); hermitCi = ci; return; }
    log(`你与${pNames()}决意归隐，从此不问仙途。`, 'rose');
    return endGame('hermit', { p: pNames() });
  }
  checkLife();
  save();
}

function playerLook() {

  const L = Object.assign({ sex: S.sex, hair: r >= 7 ? '#e3e6ee' : '#211b2a', eye: '#5a3d2a', eyes: 'closed',
    style: r === 0 ? (f ? 'twin' : 'knot') : (f ? 'long' : 'halfup'), head: [], back: [],
    seat: r >= 7 ? 'gold' : r >= 5 ? 'white' : r >= 3 ? 'pink' : 'mat',

  if (r >= 6) L.back.push('aura');
  if (r === 7 || r >= 9) L.back.push('rays');

}

  });
  num(Math.round(b.mo - a.mo), '心魔', '', true, String);
  num(b.life - a.life, '寿元', ' 年', false, String);

  if (b.ar > a.ar) o.push({ t: `聚灵阵 ${cn(b.ar)}阶`, c: 'gold' });
  if (b.fa > a.fa) o.push({ t: `法宝 ${fabaoName(b.fa)}`, c: 'gold' });
  num(b.pw - a.pw, '战力');
  if (b.bp > a.bp) o.push({ t: `${b.bpn} +1`, c: 'gold' });
  if (b.bp < a.bp) o.push({ t: `耗去 ${a.bpn}`, c: 't' });
  if (b.dp > a.dp) o.push({ t: `渡厄丹 ×${b.dp}`, c: 'gold' });

function towerLoot(f) {

  if (f % 10 === 0) { o.s *= 8; o.big = (f / 10) % 2 ? 'fabao' : 'gongfa'; }

}

function climb() {

/* ---------- 闭关（离线收益） ---------- */
const OFF_CAP = 8 * 3600;  // 至多计 8 小时
const OFF_EFF = .5;        // 闭关修炼效率为在线的一半
const OFF_AGE = .3;        // 闭关时光阴流逝放缓
let away = null;
function dur(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  if (h) return `${h} 小时${m ? ' ' + m + ' 分' : ''}`;
  return m ? `${m} 分钟` : `${sec} 秒`;
}
const shichen = s => s >= 7200 ? cn(Math.floor(s / 7200)) + '个时辰' : cn(Math.max(1, Math.floor(s / 900))) + '刻';

function closedDoor(sec) {
  if (!S.started || S.over || sec < 60) return;
  const s = Math.min(sec, OFF_CAP), M = s * MPS * OFF_EFF, a = snap(), lv0 = S.lv;
  let left = M, xp = 0;
  /* 小境界水到渠成；大境界与天劫须亲自冲关 */
  while (left > 1e-9) {
    const q = req(S.lv), need = q - S.xp;
    if (need <= 1e-9) {
      if (S.lv < TOP && !nextMajor()) { S.lv++; S.xp = 0; continue; }
      break;
    }
    const r = rate(true), t = Math.min(left, need / r);
    S.xp = Math.min(q, S.xp + r * t); xp += r * t; left -= t;
  }
  partners().forEach(c => { c.lv = Math.max(c.lv, S.lv - 1); });
  const age = Math.min((M - left) * OFF_AGE, Math.max(0, maxLifeY() * 12 - S.ageM - 24));
  S.ageM += age;
  S.stones += stipend() * M;
  S.injT = Math.max(0, S.injT - M); S.tideT = Math.max(0, S.tideT - M);
  const sc = S.sect;
  if (!sc.left) { sc.refM -= M; if (sc.refM <= 0) { genBoard(); sc.refM = 36; } sc.tourneyM -= M; }
  promote();
  log(`闭关${shichen(s)}，修为 +${fmt(xp)}${S.lv > lv0 ? '，破关至' + LEVELS[S.lv].name : ''}。`, 'good');
  away = { sec, s, xp, from: lv0, to: S.lv, ageY: Math.round(age / 12), stuck: left > 1e-9, ds: deltas(a, snap()) };
}
function awayHtml() {
  const A = away, L = LEVELS[S.lv];
  const gate = L.trib ? (S.lv === TOP ? '鸿蒙道劫' : '九九天劫') : REALMS[L.r + 1].n + '瓶颈';
  return `<h2>出关</h2>
    <p>你闭关${shichen(A.s)}（约 ${dur(A.sec)}），修为精进 ${fmt(A.xp)}${A.to > A.from ? `，一路破关至${L.name}` : ''}。</p>
    ${A.ds.length ? `<div class="fb gold">${fbInner({ lines: [], ds: A.ds })}</div>` : ''}

let trib = null;

const tribMul = () => (1 - Math.min(.55, .05 * S.fabao)) * (S.root === 'lei' ? .8 : 1) * (1 - Math.min(.15, .03 * S.reinc));

const FIN_MUL = 2.5;

  const pts = [[rnd(w * .2, w * .8), 0]];
  let [x, y] = pts[0];
  while (y < h * .5) { x += rnd(-40, 40); y += rnd(18, 46); pts.push([x, y]); }
  pts.push([w / 2, h / 2]);
  bolts.push({ pts, life: 1 });
}

/* ---------- 结局与轮回 ---------- */
function endGame(id, ctx) {
  if (S.over) return;
  S.over = id;
  S.endCtx = Object.assign({ name: S.name, lv: LEVELS[S.lv].name, p: pNames() || (S.comps[0] ? S.comps[0].name : '') }, ctx || {});
  S.pending = null;
  if (!endings.includes(id)) {
    endings.push(id);
    try { localStorage.setItem(END_KEY, JSON.stringify(endings)); } catch (e) {}
  }
  save(); showModal();
}
function reincarnate() {
  S = fresh(S); FB = null;
  genBoard();
  logDirty = true;
  save(); showModal();
}

/* ---------- 灵根测验 ---------- */
function rollRoot() {
  const boost = 1 + .6 * S.reinc;
  const ws = ROOTS.map((r, i) => r.w * (i < 3 ? boost : 1));
  let x = Math.random() * ws.reduce((a, b) => a + b, 0), i = 0;
  while ((x -= ws[i]) > 0) i++;
  const R = ROOTS[i];
  const pool = ELS.split('').sort(() => Math.random() - .5);
  S.root = R.id;
  S.els = R.id === 'lei' ? '雷' : pool.slice(0, R.els).sort((a, b) => ELS.indexOf(a) - ELS.indexOf(b)).join('');
}
let rolling = false;
function testRoot(isReroll) {
  if (rolling) return;
  if (isReroll) { if (S.rerolls <= 0) return; S.rerolls--; }
  rolling = true;
  const box = $('#rootbox'); let n = 0;
  const iv = setInterval(() => {
    box.innerHTML = `<div class="rn" style="color:var(--muted)">${pick(ROOTS).n}</div><div class="rd">测灵石光芒流转……</div>`;
    if (++n > (RM ? 1 : 14)) { clearInterval(iv); rollRoot(); rolling = false; showModal(); }
  }, 70);
}

  return head + `<div class="list">${order.map(i => cards[i]).join('')}</div>`;
}

function sideHome() {
  const up = (k, title, now, eff, c) => `<div class="item"><h3>${title}</h3>
    <div class="act"><button class="btn sm" data-act="up" data-k="${k}" type="button" ${S.stones < c ? 'disabled' : ''}>${k === 'fabao' ? '祭炼' : k === 'array' ? '布阵' : '参悟'}</button>${costTag(c)}</div>
    <div class="meta">${now}</div><p>${eff}</p>${fbHtml('up:' + k)}</div>`;
  return '<div class="list">'
    + up('gongfa', '功法', `《${gongfaName(S.gongfa)}》`, `修炼速度 ×${(1 + .3 * S.gongfa).toFixed(1)}，下一重 ×${(1 + .3 * (S.gongfa + 1)).toFixed(1)}。转世时可保留一半。`, costGongfa())
    + up('array', '聚灵阵', S.array ? cn(S.array) + '阶聚灵阵' : '洞府空空如也', `汇聚灵气，修炼速度 ×${(1 + .25 * S.array).toFixed(2)}，下一阶 ×${(1 + .25 * (S.array + 1)).toFixed(2)}。`, costArray())
    + up('fabao', '本命法宝', `${fabaoName(S.fabao)} · 战力 ${fmt(pwr())} → ${fmt(Math.round(power() / (1 + .15 * S.fabao) * (1 + .15 * (S.fabao + 1)) * 100))}`, `斗法战力 ×${(1 + .15 * S.fabao).toFixed(2)}，渡劫时护体 +6、天雷减伤 ${Math.min(55, 5 * S.fabao)}%。`, costFabao())
    + '</div>';
}

function sidePill() {
  return '<div class="list">' + pills().map(P => `<div class="item"><h3>${P.n}</h3>
    <div class="act"><button class="btn sm" data-act="brew" data-id="${P.id}" type="button" ${!P.ok || S.herbs < P.h || S.stones < P.s ? 'disabled' : ''}>${P.ok ? '炼制' : P.why}</button>${costTag(P.s, P.h)}</div>
    <div class="meta">${P.id === 'po' || P.id === 'due' ? '冲关之物' : P.id === 'zhan' ? '登塔之物' : '炼成即服'}</div><p>${P.d}</p>${fbHtml('brew:' + P.id)}</div>`).join('') + '</div>';
}

function sideTower() {
  const f = S.tower + 1, w = towerWin(f), L = towerLoot(f), boss = f % 10 === 0;
  const nb = Math.ceil(f / 10) * 10, NB = towerLoot(nb);
  return `<div class="sum"><div class="top"><span class="rank">第 ${f} 层</span><span class="chip gold">历代最高 ${towerBest} 层</span></div>
    <p class="note">一座无尽之塔，一层比一层强，每十层有妖王镇守。塔灵护持，落败只会负伤、不会陨落。本世已登 ${S.tower} 层，转世后从头爬起。</p></div>
    <div class="list"><div class="item"><h3>${towerMon(f)}${boss ? '<span class="chip red">妖王</span>' : ''}${riskChip(w)}</h3>
      <div class="act"><button class="btn sm ${boss ? 'gold' : ''}" data-act="climb" type="button">挑战</button></div>
      <div class="meta">耗时 1 月 · 守关战力 ${fmt(shown(towerFoe(f)))} · 你 ${fmt(Math.round(towerPow() * 100))}${S.zhanyi ? '（战意丹）' : ''} · 胜算 ${Math.round(w * 100)}%</div>
      <p>过关得灵石 ${fmt(L.s)}${L.h ? '、灵草 ' + L.h + ' 株' : ''}${L.big ? '，另得' + bigName(L.big) : ''}。</p>${fbHtml('climb')}</div></div>
    ${boss ? '' : `<p class="note" style="margin-top:10px">第${nb}层妖王：${towerMon(nb)}，守关战力 ${fmt(shown(towerFoe(nb)))}，击败得${bigName(NB.big)}与灵石 ${fmt(NB.s)}。</p>`}
    <p class="note" style="margin-top:6px">战力 = 境界 × 法宝 × 道侣助阵（每位 +10%）。丹房可炼战意丹，下一战战力 ×1.3。${S.injT > 0 ? '<br><span style="color:var(--cinnabar)">你正负伤，战力打七折，可先服疗伤丹。</span>' : ''}</p>`;
}

function renderSide() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  const f = { trip: sideTrip, tower: sideTower, sect: sideSect, comp: sideComp, home: sideHome, pill: sidePill }[tab] || sideTrip;
  setHtml('#side-body', f());
}

function renderLog() {
  if (!logDirty) return;
  logDirty = false;
  $('#log').innerHTML = S.log.length
    ? S.log.map(e => `<li class="${e.k}"><time>${e.a}岁</time><span>${esc(e.t)}</span></li>`).join('')
    : '<li><time>—</time><span style="color:var(--muted)">尚未踏上仙途。</span></li>';
}

/* ---------- 阵盘 ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d'), disc = $('#disc');
let W = 0;
function sizeCv() {
  const d = Math.min(2, devicePixelRatio || 1);
  W = disc.clientWidth;
  cv.width = W * d; cv.height = W * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
new ResizeObserver(sizeCv).observe(disc);
const cs = getComputedStyle(document.documentElement);
const C = {};
['--jade', '--gold', '--muted', '--line', '--fg', '--cinnabar', '--bolt', '--rose'].forEach(k => C[k.slice(2)] = cs.getPropertyValue(k).trim());
const TRI = '☰☱☲☳☴☵☶☷', GAN = '甲乙丙丁戊己庚辛壬癸';
const parts = Array.from({ length: 160 }, () => ({ a: Math.random() * 6.283, r: Math.random(), s: rnd(.5, 1.5) }));
let rings = [], rot = 0, T = 0;
function ripple(k, col) { rings.push({ r: .1, life: 1, k, c: col === 'gold' ? C.gold : col === 'red' ? C.cinnabar : C.jade }); }
function floatText(t) {
  const s = document.createElement('span');
  s.className = 'float'; s.textContent = t;
  s.style.left = rnd(38, 62) + '%'; s.style.top = rnd(30, 44) + '%';
  disc.appendChild(s);
  setTimeout(() => s.remove(), 950);
}

function draw(dt) {
  if (!W) return;
  T += dt;
  const w = W, c = w / 2, R = w * .47;
  ctx.clearRect(0, 0, w, w);
  rot += dt * (RM ? .01 : .07);

  ctx.lineWidth = 1; ctx.strokeStyle = C.line;
  [1, .84, .66].forEach(f => { ctx.beginPath(); ctx.arc(c, c, R * f, 0, 6.283); ctx.stroke(); });
  ctx.setLineDash([2, 5]);
  ctx.beginPath(); ctx.arc(c, c, R * .5, 0, 6.283); ctx.stroke();
  ctx.setLineDash([]);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = S.mo >= 70 ? C.cinnabar : C.gold; ctx.globalAlpha = .7;
  ctx.font = `${Math.round(w * .06)}px serif`;
  for (let i = 0; i < 8; i++) {
    const a = rot + i * Math.PI / 4;
    ctx.save(); ctx.translate(c + Math.cos(a) * R * .92, c + Math.sin(a) * R * .92); ctx.rotate(a + Math.PI / 2);
    ctx.fillText(TRI[i], 0, 0); ctx.restore();
  }
  ctx.fillStyle = C.muted; ctx.globalAlpha = .75;
  ctx.font = `${Math.round(w * .036)}px "Noto Serif SC", serif`;
  for (let i = 0; i < 10; i++) {
    const a = -rot * 1.6 + i * Math.PI / 5;
    ctx.save(); ctx.translate(c + Math.cos(a) * R * .75, c + Math.sin(a) * R * .75); ctx.rotate(a + Math.PI / 2);
    ctx.fillText(GAN[i], 0, 0); ctx.restore();
  }
  ctx.globalAlpha = 1;

  const q = req(S.lv), f = clamp(S.xp / q, 0, 1), full = f >= 1;
  ctx.strokeStyle = full ? C.gold : C.jade; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.globalAlpha = full ? .6 + .4 * Math.sin(T * 4) : .9;
  ctx.beginPath(); ctx.arc(c, c, R * .58, -Math.PI / 2, -Math.PI / 2 + 6.283 * f); ctx.stroke();
  ctx.globalAlpha = 1;

  const live = S.started && !S.over;
  const inten = live ? clamp(Math.log10(rate() + 1) / 5, .2, 1) : .12;
  const n = Math.floor(30 + 130 * inten);
  const pa = partner();
  for (let i = 0; i < n; i++) {
    const p = parts[i];
    if (!full) p.r -= dt * (.08 + .3 * inten) * p.s * (RM ? .3 : 1);
    p.a += dt * .5 * p.s / (p.r + .25) * (RM ? .3 : 1);
    if (p.r < .1) { p.r = 1; p.a = Math.random() * 6.283; }
    const rr = p.r * R * .55;
    ctx.fillStyle = pa && i % 5 === 0 ? C.rose : C.jade;
    ctx.globalAlpha = (full ? .35 : .15 + .75 * (1 - p.r));
    ctx.beginPath(); ctx.arc(c + Math.cos(p.a) * rr, c + Math.sin(p.a) * rr, 1.2 + (1 - p.r) * .8, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const rl = realm(), col = rl >= 2 ? C.gold : C.jade;
  const cr = w * (.03 + .008 * Math.min(rl, 10)) * (1 + .07 * Math.sin(T * 2));
  const g = ctx.createRadialGradient(c, c, 0, c, c, cr * 3.2);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = rl === 0 ? .55 : .85;
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c, c, cr * 3.2, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1; ctx.fillStyle = rl >= 3 ? C.fg : col;
  ctx.beginPath(); ctx.arc(c, c, cr * .55, 0, 6.283); ctx.fill();

  rings = rings.filter(r => (r.life -= dt * 1.4) > 0);
  rings.forEach(r => {
    r.r += dt * .6 * r.k;
    ctx.strokeStyle = r.c; ctx.lineWidth = 1.5 * r.k; ctx.globalAlpha = r.life * .8;
    ctx.beginPath(); ctx.arc(c, c, R * r.r, 0, 6.283); ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function drawTrib(dt) {
  if (!trib && !bolts.length) return;
  const w = innerWidth, h = innerHeight;
  tctx.clearRect(0, 0, w, h);
  bolts = bolts.filter(b => (b.life -= dt * 2.2) > 0);
  bolts.forEach(b => {
    tctx.strokeStyle = C.bolt; tctx.globalAlpha = b.life;
    tctx.shadowColor = C.bolt; tctx.shadowBlur = 24;
    [5, 2].forEach(lw => {
      tctx.lineWidth = lw; tctx.beginPath();
      b.pts.forEach(([x, y], i) => i ? tctx.lineTo(x, y) : tctx.moveTo(x, y)); tctx.stroke();
    });
  });
  tctx.shadowBlur = 0; tctx.globalAlpha = 1;
}

/* ---------- 存档 ---------- */
/* t：最后一次在线的时刻。页面藏到后台时不刷新它，回来时按这段空白结算闭关 */
function save() {
  if (!document.hidden) S.t = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function settleAway() {
  const sec = (Date.now() - (S.t || Date.now())) / 1000;
  S.t = Date.now();
  if (!trib) closedDoor(sec);
  if (away) { save(); showModal(); }
}
function hydrate(d) {
  if (!d || d.v !== 1) return null;
  const f = fresh(null);
  const s = Object.assign(f, d);
  s.sect = Object.assign(fresh(null).sect, d.sect || {});
  /* 旧存档只有一位道侣：迁移成列表，并补上形象 */
  if (!Array.isArray(d.comps)) s.comps = d.comp ? [d.comp] : [];
  delete s.comp;
  if (s.pending && s.pending.id === 'reveal' && s.pending.ci == null) s.pending.ci = 0;
  s.comps.forEach(c => {
    if (!c.sex) c.sex = s.sex === 'f' ? 'm' : 'f';
    if (!c.look) c.look = genLook(c);
  });
  if (s.pending && s.pending.id === 'meet' && !s.pending.c.look) { s.pending.c.sex = s.pending.c.sex || (s.sex === 'f' ? 'm' : 'f'); s.pending.c.look = genLook(s.pending.c); }
  return s;
}
function load() {
  try { return hydrate(JSON.parse(localStorage.getItem(SAVE_KEY) || 'null')); } catch (e) { return null; }
}

/* ---------- 交互 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab]');
  if (!t || t.disabled) return;
  if (t.dataset.tab) {
    tab = t.dataset.tab;
    try { localStorage.setItem('wendao-tab', tab); } catch (err) {}
    return renderSide();
  }
  const a = t.dataset.act;
  const i = t.dataset.i, id = t.dataset.id, k = t.dataset.k;
  if (a === 'go') act('go:' + i, () => trip(+i));
  else if (a === 'task') act('task:' + i, () => doTask(+i));
  else if (a === 'ex') act('ex:' + id, () => exchange(id));
  else if (a === 'comp') { const ci = +t.dataset.ci; act('comp:' + ci + ':' + k, () => compAct(k, ci)); }
  else if (a === 'sex') { S.sex = t.dataset.v; save(); showModal(); }
  else if (a === 'up') act('up:' + k, () => upgrade(k));
  else if (a === 'brew') act('brew:' + id, () => brew(id));
  else if (a === 'choose') act('', () => choose(+i));
  else if (a === 'climb') act('climb', climb);
  else if (a === 'away') { away = null; save(); showModal(); }
  else if (a === 'gallery') { ui = 'gallery'; showModal(); }
  else if (a === 'close') { ui = null; showModal(); }
  else if (a === 'test') testRoot(false);
  else if (a === 'reroll') testRoot(true);
  else if (a === 'begin') {
    S.name = ($('#dao-name').value.trim() || S.name).slice(0, 6);
    S.started = true;
    log(S.reinc
      ? `第${cn(S.reinc + 1)}世，${S.name}再度踏入仙途，身具${root().n}（${S.els}）。`
      : `${S.name}拜入${SECT}外门，身具${root().n}（${S.els}），自此踏上仙途。`, 'gold');
    save(); showModal();
  }
  else if (a === 'reinc') reincarnate();
  if (S.pending && $('#modal').hidden) showModal();
  renderStatus(); renderSide(); renderLog();
});
document.addEventListener('input', e => {
  if (e.target.id === 'dao-name') S.name = e.target.value.trim().slice(0, 6) || S.name;
});
$('#b-med').addEventListener('click', meditate);
$('#b-sex').addEventListener('click', () => { S.sex = S.sex === 'f' ? 'm' : 'f'; save(); renderStatus(); if (!S.started) showModal(); });
$('#b-break').addEventListener('click',() => { act('', breakthrough); renderStatus(); renderSide(); renderLog(); });
disc.addEventListener('pointerdown', e => { e.preventDefault(); meditate(); });
disc.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); meditate(); } });
let resetArm = 0;
$('#b-reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (Date.now() - resetArm < 3000) {
    S = fresh(null); FB = null; genBoard(); logDirty = true; resetArm = 0; ui = null; b.textContent = '散功重修';
    save(); showModal(); renderStatus(); renderSide(); renderLog();
  } else {
    resetArm = Date.now(); b.textContent = '确认？此世尽毁';
    setTimeout(() => { if (Date.now() - resetArm >= 3000) b.textContent = '散功重修'; }, 3100);
  }
});
addEventListener('resize', () => { if (trib) sizeT(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { S.t = Date.now(); save(); }
  else settleAway();
});
setInterval(save, 5000);

/* ---------- 启动 ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.25, (now - last) / 1000); last = now;
  tick(dt); draw(dt); drawTrib(dt);
  if ((acc += dt) > .1) { acc = 0; renderStatus(); renderSide(); renderLog(); }
  requestAnimationFrame(frame);
}
function start(data) {
  S = (data && hydrate(data.state)) || load() || fresh(null);
  if (!S.sect.tasks.length) genBoard();
  logDirty = true;
  if (!data || !data.state) settleAway();
  sizeCv(); showModal(); renderStatus(); renderSide(); renderLog();
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.snapshot?.(() => ({ state: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
